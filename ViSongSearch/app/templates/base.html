<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ViSongSearch{% endblock %}</title>
{% block head %}{% endblock %}
<style>
  :root { --fg:#1d1d1f; --muted:#5f6368; --accent:#0b57d0; --bg:#fff; --card:#f6f8fb; --mark:#ffe58a; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--fg); background:var(--bg);
         max-width: 760px; margin: 0 auto; padding: 16px; line-height: 1.5; }
  header a { color: inherit; text-decoration: none; font-weight: 700; font-size: 1.3rem; }
  form { display:flex; gap:8px; margin: 12px 0 20px; }
  input[type=search] { flex:1; padding: 10px 14px; font-size: 1rem; border:1px solid #c4c7c5; border-radius: 24px; }
  button { padding: 10px 18px; border:0; border-radius: 24px; background: var(--accent); color:#fff; font-size:1rem; }
  .muted { color: var(--muted); font-size: .9rem; }
  .result { padding: 10px 0; border-bottom: 1px solid #eee; }
  .result a.title { font-size: 1.1rem; color: var(--accent); text-decoration: none; }
  mark { background: var(--mark); padding: 0 1px; }
  .card { background: var(--card); padding: 12px 14px; border-radius: 10px; margin: 8px 0; }
  table { border-collapse: collapse; width: 100%; } td, th { text-align:left; padding: 4px 6px; border-bottom:1px solid #eee; }
</style>
</head>
<body>
<header><a href="/">🎵 ViSongSearch</a></header>
{% block body %}{% endblock %}
<footer class="muted" style="margin-top:32px">Đồ án SEG301 / TMG301 · tìm bài hát khi chỉ nhớ lờ mờ · <a href="/stats">thống kê</a></footer>
</body>
</html>
