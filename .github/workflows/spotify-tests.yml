name: Spotify crawler tests
on:
  push:
    paths: ['members/dienle25/spotify-crawler/**', '.github/workflows/spotify-tests.yml']
  pull_request:
    paths: ['members/dienle25/spotify-crawler/**', '.github/workflows/spotify-tests.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: members/dienle25/spotify-crawler
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
